<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Chat App</title>
  <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; height: 100vh; margin: 0; background: #f5f5f5; }
    #chatContainer { display: flex; width: 100%; max-width: 1200px; margin: 0 auto; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    #chatList { width: 30%; border-right: 1px solid #e0e0e0; overflow-y: auto; padding: 15px; background: #fafafa; }
    #chatList li { cursor: pointer; margin: 8px 0; padding: 10px; border-radius: 8px; transition: background 0.2s; }
    #chatList li:hover { background-color: #e3f2fd; }
    #chatList li.active { background-color: #2196f3; color: white; }
    #chatWindow { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    /* Enhanced message styling */
    #messages { flex: 1; list-style: none; padding: 20px; margin: 0; overflow-y: auto; background: #fff; }
    #messages li { margin: 10px 0; padding: 12px 16px; border-radius: 18px; max-width: 70%; word-wrap: break-word; }
    #messages li.sent { background: #2196f3; color: white; margin-left: auto; text-align: right; }
    #messages li.received { background: #f1f1f1; color: #333; margin-right: auto; }
    
    /* Better input styling */
    #inputContainer { display: flex; padding: 20px; border-top: 1px solid #e0e0e0; background: #fafafa; gap: 10px; }
    #messageText { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }
    #messageText:focus { border-color: #2196f3; }
    #sendBtn { padding: 12px 24px; background: #2196f3; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: 500; }
    #sendBtn:hover { background: #1976d2; }
    #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
    
    /* Enhanced search and chat list styling */
    #searchContainer { margin-bottom: 20px; }
    #searchInput { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
    #searchInput:focus { border-color: #2196f3; }
    #searchResults { list-style: none; padding: 0; margin: 10px 0; }
    #searchResults li { margin: 5px 0; padding: 8px; background: white; border-radius: 6px; border: 1px solid #e0e0e0; }
    #existingChats { list-style: none; padding: 0; margin-top: 15px; }
    #existingChats li { margin: 8px 0; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; background: white; }
    #existingChats li:hover { background-color: #f8f9fa; border-color: #2196f3; }
    #existingChats li.active { background-color: #2196f3; color: white; border-color: #2196f3; }
    .chat-preview { font-size: 12px; color: #666; margin-top: 4px; }
    #existingChats li.active .chat-preview { color: rgba(255,255,255,0.8); }
    
    /* Better header styling */
    .chat-header { padding: 20px; border-bottom: 1px solid #e0e0e0; background: #fafafa; }
    .chat-header h3 { margin: 0; color: #333; }
    .chat-header .status { font-size: 12px; color: #666; margin-top: 4px; }
    
    /* Enhanced typing indicator */
    #typingIndicator {
      position: absolute;
      bottom: 80px;
      left: 30px;
      background: #f1f1f1;
      padding: 8px 16px;
      border-radius: 18px;
      font-size: 13px;
      color: #666;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .typing-dots {
      display: flex;
      gap: 2px;
    }
    
    .typing-dot {
      width: 6px;
      height: 6px;
      background: #666;
      border-radius: 50%;
      animation: typingPulse 1.4s infinite ease-in-out;
    }
    
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typingPulse {
      0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="chatContainer">
    <div id="chatList">
      <div id="searchContainer">
        <!-- Enhanced search with better placeholder -->
        <input id="searchInput" placeholder="🔍 Search users by name..." />
        <ul id="searchResults"></ul>
      </div>
      <div>
        <h4 style="margin: 0 0 10px 0; color: #333;">💬 Your Chats</h4>
        <ul id="existingChats"></ul>
      </div>
      <!-- Added quick user ID input -->
      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
        <h4 style="margin: 0 0 10px 0; color: #333;">🆔 Quick Chat</h4>
        <input id="quickUserId" placeholder="Enter user ID to chat..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 15px; margin-bottom: 8px;" />
        <button id="quickChatBtn" style="width: 100%; padding: 8px; background: #4caf50; color: white; border: none; border-radius: 15px; cursor: pointer;">Start Chat</button>
      </div>
    </div>
    <div id="chatWindow">
      <!-- Added chat header -->
      <div class="chat-header" id="chatHeader" style="display: none;">
        <h3 id="chatTitle">Select a chat</h3>
        <div class="status" id="chatStatus">Choose a user to start messaging</div>
      </div>
      <ul id="messages"></ul>
      <div id="typingIndicator">
        <span>Typing</span>
        <div class="typing-dots">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
      <div id="inputContainer">
        <input id="messageText" placeholder="Type your message..." />
        <button id="sendBtn" disabled>Send</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io("http://localhost:5000");
    let myUserId = null;
    let currentChatUserId = null;
    let currentChatUserName = null;
    let authToken = null;
    let typingTimeout = null;
    let isTyping = false;

    const chatList = document.getElementById("chatList");
    const messagesList = document.getElementById("messages");
    const messageText = document.getElementById("messageText");
    const sendBtn = document.getElementById("sendBtn");
    const searchInput = document.getElementById("searchInput");
    const searchResults = document.getElementById("searchResults");
    const existingChats = document.getElementById("existingChats");
    const typingIndicator = document.getElementById("typingIndicator");
    const quickUserId = document.getElementById("quickUserId");
    const quickChatBtn = document.getElementById("quickChatBtn");
    const chatHeader = document.getElementById("chatHeader");
    const chatTitle = document.getElementById("chatTitle");
    const chatStatus = document.getElementById("chatStatus");

    myUserId = prompt("Enter your MongoDB User ID:");
    if (!myUserId) {
        alert("You must enter a User ID to use chat!");
        location.reload();
    } else {
        authToken = prompt("Enter your JWT token (optional - leave empty for no auth):");
        if (!authToken) {
            console.log("No token provided, attempting without authentication");
        }
        socket.emit("register", myUserId);
        loadExistingChats();
        chatStatus.textContent = `Logged in as: ${myUserId}`;
    }

    quickChatBtn.onclick = () => {
      const userId = quickUserId.value.trim();
      if (!userId) return alert("Please enter a user ID!");
      
      hideTypingIndicator();
      currentChatUserId = userId;
      currentChatUserName = `User ${userId.substring(0, 8)}...`;
      updateChatHeader();
      messagesList.innerHTML = "";
      quickUserId.value = "";
      openChat(userId);
      sendBtn.disabled = false;
    };

    messageText.oninput = () => {
      sendBtn.disabled = !messageText.value.trim() || !currentChatUserId;
      
      if (currentChatUserId && !isTyping && messageText.value.trim()) {
        isTyping = true;
        socket.emit("typing", { from: myUserId, to: currentChatUserId });
      }
      
      clearTimeout(typingTimeout);
      
      typingTimeout = setTimeout(() => {
        if (isTyping) {
          isTyping = false;
          socket.emit("stopTyping", { from: myUserId, to: currentChatUserId });
        }
      }, 1000);
    };

    sendBtn.onclick = async () => {
      const text = messageText.value.trim();
      if (!currentChatUserId || !text) return;

      if (isTyping) {
        isTyping = false;
        clearTimeout(typingTimeout);
        socket.emit("stopTyping", { from: myUserId, to: currentChatUserId });
      }

      try {
        const headers = { "Content-Type": "application/json" };
        if (authToken) headers.Authorization = `Bearer ${authToken}`;

        const response = await fetch(`http://localhost:5000/api/messages/send`, {
          method: "POST",
          headers: headers,
          body: JSON.stringify({ to: currentChatUserId, text, messageType: 'direct' })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        console.log("Message sent successfully:", result);

        addMessageItem(text, true);
        messageText.value = "";
        sendBtn.disabled = true;
        socket.emit("sendMessage", { toUserId: currentChatUserId, text });
        loadExistingChats();
      } catch (err) {
        console.error("Error sending message:", err);
        alert(`Error sending message: ${err.message}`);
      }
    };

    messageText.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !sendBtn.disabled) {
        sendBtn.click();
      }
    });

    // Listen for incoming messages
    socket.on("receiveMessage", (msg) => {
      if (msg.from === currentChatUserId || msg.from === myUserId) {
        addMessageItem(msg.text, msg.from === myUserId);
        loadExistingChats();
      }
    });

    socket.on("typing", (data) => {
      if (data.from === currentChatUserId) {
        showTypingIndicator();
      }
    });

    socket.on("stopTyping", (data) => {
      if (data.from === currentChatUserId) {
        hideTypingIndicator();
      }
    });

    function showTypingIndicator() {
      typingIndicator.style.display = "flex";
    }

    function hideTypingIndicator() {
      typingIndicator.style.display = "none";
    }

    function addMessageItem(text, isSent = false) {
      const li = document.createElement("li");
      li.textContent = text;
      li.className = isSent ? 'sent' : 'received';
      messagesList.appendChild(li);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    function updateChatHeader() {
      chatHeader.style.display = 'block';
      chatTitle.textContent = currentChatUserName || `Chat with ${currentChatUserId}`;
      chatStatus.textContent = 'Active now';
    }

    async function loadExistingChats() {
      try {
        const headers = {};
        
        if (authToken) {
          headers.Authorization = `Bearer ${authToken}`;
        }

        console.log("Loading existing chats for user:", myUserId);
        
        const res = await fetch(`http://localhost:5000/api/messages/getAllChats`, {
          headers: headers
        });
        
        console.log("Response status:", res.status);
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error("Error response:", errorText);
          throw new Error(`HTTP error! status: ${res.status} - ${errorText}`);
        }
        
        const data = await res.json();
        console.log("Chats data received:", data);
        
        existingChats.innerHTML = "";
        
        if (data.success && data.chats && data.chats.length > 0) {
          data.chats.forEach(chat => {
            const li = document.createElement("li");
            li.style.cursor = "pointer";
            
            const chatName = chat.otherUser ? chat.otherUser.name : `User ${chat.otherUserId}`;
            const lastMessage = chat.lastMessage ? chat.lastMessage.text : 'No messages yet';
            
            li.innerHTML = `
              <div><strong>${chatName}</strong></div>
              <div class="chat-preview">${lastMessage.substring(0, 30)}${lastMessage.length > 30 ? '...' : ''}</div>
            `;
            
            li.onclick = () => {
              document.querySelectorAll('#existingChats li').forEach(item => {
                item.classList.remove('active');
              });
              li.classList.add('active');
              
              hideTypingIndicator();
              currentChatUserId = chat.otherUserId;
              currentChatUserName = chatName;
              updateChatHeader();
              openChat(chat.otherUserId);
              sendBtn.disabled = false;
            };
            
            existingChats.appendChild(li);
          });
        } else {
          const li = document.createElement("li");
          li.textContent = data.message || "No existing chats. Search for users to start chatting!";
          li.style.fontStyle = "italic";
          li.style.color = "#666";
          existingChats.appendChild(li);
        }
      } catch (err) {
        console.error("Error loading existing chats:", err);
        const li = document.createElement("li");
        li.textContent = `Error loading chats: ${err.message}`;
        li.style.color = "red";
        existingChats.appendChild(li);
      }
    }

    searchInput.oninput = async () => {
      const query = searchInput.value.trim();
      if (!query) { 
        searchResults.innerHTML = ""; 
        return; 
      }

      try {
        const headers = {};
        if (authToken) headers.Authorization = `Bearer ${authToken}`;

        const res = await fetch(`http://localhost:5000/api/users/search?query=${query}`, {
          headers: headers
        });
        
        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const data = await res.json();
        console.log("Search results:", data);
        
        searchResults.innerHTML = "";
        if (data.success && data.users && data.users.length > 0) {
          data.users.forEach(u => {
            const li = document.createElement("li");
            li.innerHTML = `
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <span><strong>${u.name}</strong></span>
                <button onclick="startChatWithUser('${u._id}', '${u.name}')" style="padding: 4px 12px; background: #2196f3; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 12px;">Chat</button>
              </div>
            `;
            searchResults.appendChild(li);
          });
        } else {
          const li = document.createElement("li");
          li.textContent = data.message || "No users found";
          li.style.fontStyle = "italic";
          li.style.color = "#666";
          searchResults.appendChild(li);
        }
      } catch (err) {
        console.error("Search error:", err);
        const li = document.createElement("li");
        li.textContent = `Search error: ${err.message}`;
        li.style.color = "red";
        searchResults.appendChild(li);
      }
    };

    window.startChatWithUser = (userId, userName) => {
      hideTypingIndicator();
      currentChatUserId = userId;
      currentChatUserName = userName;
      updateChatHeader();
      messagesList.innerHTML = "";
      searchResults.innerHTML = "";
      searchInput.value = "";
      openChat(userId);
      sendBtn.disabled = false;
      
      // Update active chat in existing chats
      document.querySelectorAll('#existingChats li').forEach(item => {
        item.classList.remove('active');
      });
    };

    async function openChat(userId) {
      messagesList.innerHTML = "";
      try {
        const headers = {};
        if (authToken) headers.Authorization = `Bearer ${authToken}`;

        const res = await fetch(`http://localhost:5000/api/messages/getDirectMessages/${userId}`, {
          headers: headers
        });
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error("Error loading messages:", errorText);
          throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const data = await res.json();
        console.log("Messages data:", data);
        
        if (data.success && data.messages && data.messages.length > 0) {
          data.messages.forEach(msg => {
            const isFromMe = msg.from._id === myUserId || msg.from === myUserId;
            addMessageItem(msg.text, isFromMe);
          });
        } else {
          const li = document.createElement("li");
          li.textContent = "No messages yet. Start the conversation!";
          li.style.fontStyle = "italic";
          li.style.color = "#666";
          li.style.textAlign = "center";
          li.style.background = "none";
          li.style.margin = "20px auto";
          messagesList.appendChild(li);
        }
      } catch (err) {
        console.error("Error fetching messages:", err);
        const li = document.createElement("li");
        li.textContent = `Error loading messages: ${err.message}`;
        li.style.color = "red";
        li.style.textAlign = "center";
        messagesList.appendChild(li);
      }
    }
  </script>
</body>
</html>
